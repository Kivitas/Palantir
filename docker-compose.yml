# OPTIONAL SELF-HOST ONLY. Not used by the Cloudflare Pages deployment (see docs/CLOUDFLARE.md).
# Runs Osiris and Aegis Nexus (nginx) on one Docker network. Requires Docker.
name: palantir

services:
  osiris:
    # The image tag must be set explicitly (in .env or the shell) to a reviewed release tag or digest,
    # e.g. OSIRIS_IMAGE_TAG=v1.2.3 or OSIRIS_IMAGE_TAG=v1.2.3@sha256:... . There is no default on purpose:
    # `latest` changes under you on every pull, and the fork ecosystem moves fast, so an unpinned
    # image would run code nobody reviewed. Compose refuses to start while the variable is unset or empty.
    image: ghcr.io/simplifaisoul/osiris:${OSIRIS_IMAGE_TAG:?set a pinned tag or digest}
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    # Internal only: reached by the palantir container through nginx at osiris:3000.
    expose:
      - "3000"

  palantir:
    build: .
    depends_on:
      - osiris
    restart: unless-stopped
    ports:
      - "8080:80"
