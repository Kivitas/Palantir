# OPTIONAL SELF-HOST ONLY. Used by the Dockerfile only; Cloudflare Pages uses public/_headers and functions/osiris instead.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # TODO: add a Content-Security-Policy once the external origins (Google Fonts, tile servers) are settled.

    # Docker embedded DNS. Resolved per request (via variable below) so nginx
    # starts even if the osiris container is not up yet.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Osiris sidecar, same origin. Strips the /osiris prefix:
    # /osiris/api/earthquakes -> osiris:3000/api/earthquakes
    location /osiris/ {
        set $osiris_upstream http://osiris:3000;
        rewrite ^/osiris/(.*)$ /$1 break;
        proxy_pass $osiris_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep streamed responses (SSE, e.g. the Osiris assistant) flowing.
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
